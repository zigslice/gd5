<!DOCTYPE html>
<html lang="zh-CN" data-gd-theme="orange">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoverFlow demo</title>
  <link rel="stylesheet" href="../src/ui/css/ui.css" />
  <style>
    body {
      margin: 24px;
      font-family: var(--gd-font);
      background: var(--gd-bg-spotlight);
      color: var(--gd-text);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .hint { margin: 0 0 16px; color: var(--gd-text-secondary); font-size: 14px; }
    #host { max-width: 720px; }
  </style>
</head>
<body>
  <h1>Cover Flow</h1>
  <p class="hint">封面流 — 居中正面卡片，左右倾斜叠放（游戏选角色那种）</p>
  <div id="host"></div>
  <script type="module">
    import { CoverFlow } from '../src/ui/index.js';

    const cf = new CoverFlow({
      height: 320,
      index: 2,
      items: [
        { key: 'knight', title: 'Knight', subtitle: 'Tank · Iron Order', color: 'linear-gradient(145deg,#4a5568,#1a202c)' },
        { key: 'mage', title: 'Mage', subtitle: 'Caster · Arcane', color: 'linear-gradient(145deg,#6b46c1,#2b1a4e)' },
        { key: 'ranger', title: 'Ranger', subtitle: 'Scout · Wildwood', color: 'linear-gradient(145deg,#2f8f5b,#143528)' },
        { key: 'rogue', title: 'Rogue', subtitle: 'Assassin · Night', color: 'linear-gradient(145deg,#c05621,#3b1d0f)' },
        { key: 'cleric', title: 'Cleric', subtitle: 'Support · Dawn', color: 'linear-gradient(145deg,#2b6cb0,#1a365d)' },
      ],
    });
    await cf.mount(document.getElementById('host'));
  </script>
</body>
</html>
